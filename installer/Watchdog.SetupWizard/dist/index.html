<!doctype html>

  <body>
    <div class="backdrop" aria-hidden="true"><div class="grid-plane"></div><div class="scanline"></div></div>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true">
            <defs><linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3DE8FF" /><stop offset="1" stop-color="#7C5CFF" /></linearGradient></defs>
            <path d="M17 2l13 7.5v15L17 32 4 24.5v-15z" fill="none" stroke="url(#brand-gradient)" stroke-width="2" />
            <path d="M10 20l3.5-7 3.5 5 3.5-5 3.5 7" stroke="#3DE8FF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="brand-name">WATCHDOG CONTROL</span>
          <span class="lab">setup wizard</span>
        </div>
        <div class="flight-strip" id="flight-strip" aria-hidden="true"></div>
        <div class="topbar-meta mono"><span id="version-label">Version loading</span><span id="updated-label"></span></div>
      </header>
      <div class="layout">
        <nav class="rail" aria-label="Setup progress">
          <div class="lab" id="rail-counter">Flight plan</div>
          <ol id="step-list" class="step-list"></ol>
          <p class="rail-footer" id="rail-summary">Progress saves on this computer. No owner password is collected here.</p>
        </nav>
        <main class="content" id="main-content">
          <div class="content-scroll" id="content-scroll"></div>
          <section class="status-row" aria-live="polite" aria-atomic="true">
            <span id="status-indicator" class="status-indicator"></span>
            <div><strong id="status-title">Ready</strong><p id="status-message">No service changes have been made.</p></div>

          <footer class="actions">
            <button type="button" class="button quiet" id="back-button">Back</button>
            <div class="action-group">
              <button type="button" class="button ghost" id="cancel-button">Cancel</button>
              <button type="button" class="button primary" id="next-button">Next</button>
              <button type="button" class="button primary" id="install-button" hidden>Install and verify automatically</button>
              <button type="button" class="button light" id="finish-button" hidden>Finish</button>
            </div>
          </footer>
        </main>
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
